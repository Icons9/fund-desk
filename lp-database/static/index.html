<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LP Portal</title>
<style>
:root{--bg:#f6f5f2;--panel:#fff;--ink:#1c1c1a;--muted:#6b6a65;--line:#e3e1db;--soft:#efeee9;--accent:#1f4e79;--accent-ink:#fff;--good:#2e6b3a;--warn:#8a5a00}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--panel:#1d1d1b;--ink:#ecebe7;--muted:#9b9a94;--line:#2e2e2b;--soft:#242422;--accent:#7fb0dc;--accent-ink:#111;--good:#8fc79a;--warn:#e0b057}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,"Segoe UI",Inter,Roboto,sans-serif}
header{display:flex;align-items:center;gap:24px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font-size:15px;margin:0;padding:14px 0;font-weight:650;white-space:nowrap}
nav{display:flex;gap:2px;overflow-x:auto;flex:1}
nav button{border:0;background:none;color:var(--muted);font:inherit;padding:15px 12px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
header a{color:var(--muted);font-size:13px;text-decoration:none}
main{padding:20px;max-width:1400px;margin:0 auto}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.tile b{display:block;font-size:22px;font-weight:650;font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;overflow:hidden}
.card h2{font-size:13px;margin:0 0 10px;font-weight:600;color:var(--muted);text-transform:none}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.filters input,.filters select{padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:inherit;min-width:0}
.filters input[type=search]{flex:1 1 240px}
.filters input[type=number]{width:110px}
.count{color:var(--muted);font-size:12px;margin-left:auto}
.tw{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;max-width:340px;overflow:hidden;text-overflow:ellipsis}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--soft);position:sticky;top:0}
td.n,th.n{text-align:right}
tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
.pager{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:10px;color:var(--muted);font-size:12px}
.pager button,.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer}
.pager button:disabled{opacity:.4;cursor:default}
.bar{height:8px;background:var(--accent);border-radius:2px;opacity:.8}
.drawer{position:fixed;inset:0 0 0 auto;width:min(760px,100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(0,0,0,.12);transform:translateX(105%);transition:transform .18s;z-index:10;overflow-y:auto;padding:20px 22px 40px}
.drawer.open{transform:none}
.drawer h3{margin:0 40px 4px 0;font-size:18px}
.drawer .sub{color:var(--muted);margin-bottom:16px}
.drawer .x{position:absolute;right:16px;top:14px}
dl{display:grid;grid-template-columns:200px 1fr;gap:6px 14px;margin:0 0 18px}
dt{color:var(--muted);font-size:12px}dd{margin:0;word-break:break-word}
h4{font-size:13px;margin:18px 0 8px;color:var(--muted);font-weight:600}
a{color:var(--accent)}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;background:var(--soft);color:var(--muted);margin-right:4px}
.note{color:var(--muted);font-size:12px;margin:8px 0 0}
.empty{padding:20px;color:var(--muted)}
.bar2{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;color:var(--muted);font-size:13px;flex-wrap:wrap}
a.btn{text-decoration:none;display:inline-block}
.btn.sm{padding:2px 8px;font-size:12px}
.contacts{margin:8px 0 0;padding:8px 10px;background:var(--soft);border-radius:6px;font-size:13px}
.contacts div{margin:2px 0}
.ok{color:var(--good)}.warn{color:var(--warn)}
textarea{width:100%;min-height:260px;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:13px/1.5 inherit}

.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px 16px;align-items:end}
.form label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.form select,.form input[type=number]{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:14px;padding:4px 10px;font-size:13px;color:var(--ink);margin:0;cursor:pointer}
.chips input{margin:0}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
.score{display:inline-block;min-width:38px;text-align:right;font-weight:600}
.lp{border-bottom:1px solid var(--line);padding:12px 4px}
.lp:last-child{border-bottom:0}
.lp .top{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.lp .name{font-weight:600;font-size:15px}
.lp .meta{color:var(--muted);font-size:12px}
.lp ul{margin:8px 0 0 0;padding-left:18px;color:var(--ink);font-size:13px}
.lp li{margin:2px 0}
.flag{font-size:11px;padding:1px 7px;border-radius:10px;background:var(--soft);color:var(--warn);margin-left:4px}
.meter{display:inline-block;width:60px;height:6px;background:var(--soft);border-radius:3px;vertical-align:middle;margin-left:6px}
.meter i{display:block;height:6px;background:var(--accent);border-radius:3px}

</style>
</head>
<body>
<header>
  <h1>LP Portal</h1>
  <nav id="nav">
    <button data-v="match" class="on">Find LPs</button>
    <button data-v="shortlist">Shortlist</button>
    <button data-v="family">Family offices</button>
    <button data-v="signals">Signals</button>
    <button data-v="check">Manager check</button>
    <button data-v="vcs">Find VCs</button>
    <button data-v="funds">Funds</button>
    <button data-v="managers">Managers</button>
    <button data-v="lps">LPs</button>
    <button data-v="commitments">Commitments</button>
    <button data-v="overview">Overview</button>
  </nav>
  <a href="/logout">Sign out</a>
</header>
<main id="main"></main>
<aside class="drawer" id="drawer"><button class="btn x" onclick="closeDrawer()">Close</button><div id="dbody"></div></aside>

<script>
const $ = s => document.querySelector(s);
const esc = v => v == null ? '' : String(v).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = (v, d=0) => v == null || v === '' ? '' : Number(v).toLocaleString('en-US', {maximumFractionDigits:d, minimumFractionDigits:0});
const pct = v => v == null ? '' : num(v,0) + '%';
let FACETS = null;

async function api(path) {
  const r = await fetch(path);
  if (r.status === 401) { location.href = '/login'; return; }
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
function qs(o) { return Object.entries(o).filter(([k,v]) => v !== '' && v != null && v !== 0).map(([k,v]) => k + '=' + encodeURIComponent(v)).join('&'); }
function opts(list, sel, blank) { return `<option value="">${blank}</option>` + list.map(x => `<option ${x===sel?'selected':''}>${esc(x)}</option>`).join(''); }

function table(cols, rows, onclick) {
  if (!rows.length) return '<div class="empty">No results.</div>';
  const head = cols.map(c => `<th class="${c.n?'n':''}">${c.h}</th>`).join('');
  const body = rows.map((r,i) => `<tr class="${onclick?'click':''}" data-i="${i}">` + cols.map(c => {
    const v = c.f ? c.f(r) : esc(r[c.k]);
    return `<td class="${c.n?'n':''}" title="${esc(r[c.k])}">${v}</td>`; }).join('') + '</tr>').join('');
  return `<div class="tw"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}
function bindRows(el, rows, fn) { el.querySelectorAll('tr.click').forEach(tr => tr.onclick = () => fn(rows[+tr.dataset.i])); }
function pager(res, go) {
  const pages = Math.max(1, Math.ceil(res.total / res.page_size));
  const d = document.createElement('div'); d.className = 'pager';
  d.innerHTML = `<span>Page ${res.page+1} of ${num(pages)}</span><button ${res.page<=0?'disabled':''}>Previous</button><button ${res.page>=pages-1?'disabled':''}>Next</button>`;
  const [prev, next] = d.querySelectorAll('button');
  prev.onclick = () => go(res.page-1); next.onclick = () => go(res.page+1);
  return d;
}
function debounce(fn, ms=300) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

// ---------- views ----------
const views = {
  async match() {
    const O = await api('/api/match_options');
    $('#main').innerHTML = `<div class="card"><h2>Describe the fund you are raising</h2>
      <div class="form">
        <div><label>Fund name (for email drafts)</label><input type="text" id="mfn" placeholder="e.g. Icons Deep Tech Fund I" style="width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:inherit"></div>
        <div><label>Strategy</label><select id="ms">${O.strategies.map(x=>`<option>${x}</option>`).join('')}</select></div>
        <div><label>Stage / size band</label><select id="mst"><option value="">Any</option>${O.stages.map(x=>`<option>${x}</option>`).join('')}</select></div>
        <div><label>Geographic focus</label><select id="mg">${O.geographies.map(x=>`<option>${x}</option>`).join('')}</select></div>
        <div><label>Target fund size ($m)</label><input type="number" id="msz" placeholder="e.g. 150"></div>
      </div>
      <div style="margin-top:14px"><label style="font-size:12px;color:var(--muted)">Sector themes</label>
        <div class="chips" style="margin-top:6px">${O.themes.map(t=>`<label><input type="checkbox" class="th" value="${t}">${t}</label>`).join('')}</div></div>
      <div style="margin-top:14px;display:flex;gap:16px;align-items:center;flex-wrap:wrap">
        <label class="chips" style="margin:0"><label><input type="checkbox" id="mem">First-time / emerging manager</label></label>
        <button class="primary" id="mgo">Find LPs</button></div></div>
      <div id="mres" style="margin-top:16px"></div>`;
    $('#mg').value = 'Europe';
    $('#mgo').onclick = async () => {
      const themes = [...document.querySelectorAll('.th:checked')].map(i=>i.value).join(';');
      const P = {strategy:$('#ms').value, stage:$('#mst').value, geography:$('#mg').value, themes, fund_size_m:+$('#msz').value||0, emerging:$('#mem').checked?1:0};
      LASTQ = {...P, fund_name:$('#mfn').value};
      $('#mres').innerHTML = '<div class="empty">Matching…</div>';
      const [R, F] = await Promise.all([api('/api/match?' + qs(P)), api('/api/match_fo?' + qs({strategy:P.strategy, geography:P.geography, themes}))]);
      LASTR = R;
      const lpHtml = R.public_lps.length ? R.public_lps.map((d,i) => lpCard(d,i)).join('') : '<div class="empty">None of the tracked public LPs has backed a similar fund.</div>';
      const foHtml = !F.available ? '<div class="empty">Family office data is kept out of the public repository. It appears here once the portal runs from a private repo.</div>'
        : F.family_offices.length ? F.family_offices.slice(0,30).map(f => `<div class="lp"><div class="top"><span class="name">${esc(f.name)}</span>
            <span class="meta">${esc([f.fo_type, f.city, f.country].filter(Boolean).join(' · '))}</span>
            <span class="meta">match <span class="score">${f.match}</span><span class="meter"><i style="width:${f.match}%"></i></span></span>
            <button class="btn sm" onclick='addShort(${JSON.stringify({name:f.name, kind:"Family office", country:f.country, website:f.website, why:(f.reasons||[]).join("; ")}).replace(/'/g,"&#39;")})'>Shortlist</button></div>
            <ul>${f.fund_commitments?`<li><b>LP in:</b> ${esc(f.fund_commitments)}</li>`:''}${f.sectors?`<li><b>Focus:</b> ${esc(f.sectors)}${f.stages?' · '+esc(f.stages):''}</li>`:''}
            ${f.style?`<li><b>Style:</b> ${esc(f.style)}${f.typical_cheque?' · cheque '+esc(f.typical_cheque):''}</li>`:''}
            ${f.website?`<li><a href="${/^http/.test(f.website)?esc(f.website):'https://'+esc(f.website)}" target="_blank" rel="noopener">${esc(f.website)}</a>${f.general_contact?' · '+esc(f.general_contact):''}</li>`:''}</ul></div>`).join('')
        : '<div class="empty">No family offices matched.</div>';
      $('#mres').innerHTML = `<div class="bar2"><span>${R.public_lps.length} public LPs · ${F.family_offices?F.family_offices.length:0} family offices · ${R.fof_allocators.length} fund-of-funds managers</span>
          <a class="btn" href="/api/export/hubspot.csv?${qs({...P, fund_name:LASTQ.fund_name})}">Export all to HubSpot (CSV)</a></div>
        <div class="card"><h2>Public LPs with a record of backing similar funds</h2>${lpHtml}</div>
        <div class="card" style="margin-top:16px"><h2>Family offices</h2>${foHtml}
          <p class="note">Family offices rarely publish commitments; "LP in" lists funds they are publicly known to back. Directory-only entries carry less evidence.</p></div>
        <div class="card" style="margin-top:16px"><h2>Fund-of-funds allocators (SEC Form ADV) running relevant vehicles</h2><div id="fofr"></div>
        <p class="note">${esc(R.note)} Phone and website are the firm's SEC-filed office details. Click a row for the manager check.</p></div>`;
      const el = $('#fofr');
      el.innerHTML = table([{h:'Match',k:'match',n:1,f:r=>`${r.match}<span class="meter"><i style="width:${r.match}%"></i></span>`},{h:'Allocator',k:'name'},{h:'Country',k:'country'},
        {h:'FoF vehicles',k:'n_vehicles',n:1},{h:'VC',k:'n_vc',n:1},{h:'PE',k:'n_pe',n:1},{h:'Gross assets $bn',k:'gav_bn',n:1,f:r=>num(r.gav_bn,1)},
        {h:'Phone',k:'phone'},{h:'Website',k:'websites',f:r=>r.websites?esc(r.websites.split('; ')[0]):''},{h:'Largest vehicle',k:'largest_vehicle'}], R.fof_allocators, true);
      bindRows(el, R.fof_allocators, r => showCheck(r.crd));
    };
  },

  async shortlist() {
    const S = loadShort(); const items = Object.values(S);
    const statuses = ['To contact','Contacted','Replied','Meeting','Due diligence','Committed','Passed'];
    $('#main').innerHTML = `<div class="card"><h2>Shortlist (${items.length})</h2>
      <p class="note" style="margin:0 0 10px">Kept in this browser. Export to HubSpot to share it or keep it safe.</p>
      <div class="bar2"><span></span><button class="btn" id="sx">Export shortlist to HubSpot (CSV)</button></div><div id="sl"></div></div>`;
    if (!items.length) { $('#sl').innerHTML = '<div class="empty">Nothing shortlisted yet. Use "Shortlist" on the Find LPs results.</div>'; return; }
    $('#sl').innerHTML = `<div class="tw"><table><thead><tr><th>Name</th><th>Type</th><th>Country</th><th>Status</th><th>Notes</th><th>Contact</th><th></th></tr></thead><tbody>${
      items.map((it,i)=>`<tr><td title="${esc(it.why||'')}">${esc(it.name)}</td><td>${esc(it.kind||'')}</td><td>${esc(it.country||'')}</td>
        <td><select data-i="${esc(it.name)}" class="st">${statuses.map(s=>`<option ${s===it.status?'selected':''}>${s}</option>`).join('')}</select></td>
        <td><input data-i="${esc(it.name)}" class="nt" value="${esc(it.notes||'')}" style="width:220px;padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink)"></td>
        <td>${esc((it.contacts||[]).filter(c=>c.contact_name).map(c=>c.contact_name+(c.email?' <'+c.email+'>':'')).slice(0,2).join('; '))}</td>
        <td><button class="btn sm" data-rm="${esc(it.name)}">Remove</button></td></tr>`).join('')}</tbody></table></div>`;
    document.querySelectorAll('.st').forEach(e=>e.onchange=()=>{const S=loadShort(); S[e.dataset.i].status=e.value; saveShort(S);});
    document.querySelectorAll('.nt').forEach(e=>e.onchange=()=>{const S=loadShort(); S[e.dataset.i].notes=e.value; saveShort(S);});
    document.querySelectorAll('[data-rm]').forEach(e=>e.onclick=()=>{const S=loadShort(); delete S[e.dataset.rm]; saveShort(S); views.shortlist();});
    $('#sx').onclick = () => exportShortCsv(Object.values(loadShort()));
  },

  async family(state={q:'',region:'',style:'',has_funds:0}) {
    $('#main').innerHTML = `<div class="filters"><input type="search" id="fq" placeholder="Search name, principal, sector, fund">
      <select id="fr"><option value="">All regions</option>${['India','Middle East','Asia','Europe','UK','North America'].map(x=>`<option>${x}</option>`).join('')}</select>
      <select id="fs"><option value="">Any style</option><option value="fund">Invests in funds</option><option value="both">Both</option><option value="direct">Direct only</option></select>
      <label class="chips" style="margin:0"><label><input type="checkbox" id="fh">Known fund commitments only</label></label>
      <span class="count" id="fc"></span></div><div id="fres"></div>`;
    const load = async (page=0) => {
      const res = await api('/api/family_offices?' + qs({q:$('#fq').value, region:$('#fr').value, style:$('#fs').value, has_funds:$('#fh').checked?1:0, page}));
      if (!res.available) { $('#fres').innerHTML = '<div class="empty">Family office data is kept out of the public repository. It appears once the portal runs from a private repo.</div>'; return; }
      $('#fc').textContent = num(res.total) + ' family offices';
      const el = $('#fres');
      el.innerHTML = table([{h:'Name',k:'name'},{h:'Principal',k:'principal'},{h:'City',k:'city'},{h:'Country',k:'country'},{h:'Type',k:'fo_type'},{h:'Style',k:'style'},
        {h:'Known fund commitments',k:'fund_commitments'},{h:'Sectors',k:'sectors'},{h:'Website',k:'website'}], res.rows, true);
      bindRows(el, res.rows, f => openDrawer(`<h3>${esc(f.name)}</h3><div class="sub">${esc([f.fo_type,f.city,f.country].filter(Boolean).join(' · '))}</div><dl>
        <dt>Principal</dt><dd>${esc(f.principal)}</dd><dt>Style</dt><dd>${esc(f.style)}</dd><dt>Known fund commitments</dt><dd>${esc(f.fund_commitments)}</dd>
        <dt>Sectors</dt><dd>${esc(f.sectors)}</dd><dt>Stages</dt><dd>${esc(f.stages)}</dd><dt>Typical cheque</dt><dd>${esc(f.typical_cheque)}</dd>
        <dt>Notable direct investments</dt><dd>${esc(f.notable_directs)}</dd><dt>Website</dt><dd>${esc(f.website)}</dd><dt>General contact</dt><dd>${esc(f.general_contact)}</dd>
        <dt>Sources</dt><dd>${(f.sources||'').split(' | ').filter(Boolean).map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u.replace(/^https?:\/\//,'').slice(0,60))}</a>`).join('<br>')}</dd></dl>
        <button class="btn" onclick='addShort(${JSON.stringify({name:f.name,kind:"Family office",country:f.country,website:f.website,why:f.fund_commitments||f.sectors||""}).replace(/'/g,"&#39;")})'>Add to shortlist</button>`));
      el.appendChild(pager(res, load));
    };
    const go = debounce(() => load(0));
    $('#main').querySelectorAll('input,select').forEach(i => i.addEventListener(i.tagName==='SELECT'||i.type==='checkbox'?'change':'input', go));
    load();
  },

  async signals() {
    const [S, O] = await Promise.all([api('/api/signals'), api('/api/overlap?min_lps=3')]);
    const maxT = Math.max(1, ...S.themes_recent.map(t=>t.n));
    $('#main').innerHTML = `<div class="grid2">
      <div class="card"><h2>Most active LPs (last 12 months or latest vintages)</h2><div id="sa"></div></div>
      <div class="card"><h2>Themes in the latest vintages</h2>${table([{h:'Theme',k:'theme'},{h:'Commitments',k:'n',n:1},{h:'',k:'n',f:r=>`<div class="bar" style="width:${Math.round(120*r.n/maxT)}px"></div>`},{h:'$m',k:'usd_m',n:1,f:r=>num(r.usd_m)}], S.themes_recent)}</div></div>
      <div class="card" style="margin-top:16px"><h2>Dated commitments in the last 12 months</h2><div id="sr"></div></div>
      <div class="card" style="margin-top:16px"><h2>Largest VC and PE funds first filed since 2024 (SEC Form ADV)</h2><div id="sn"></div></div>
      <div class="card" style="margin-top:16px"><h2>Managers backed by three or more tracked LPs</h2><div id="so"></div></div>`;
    $('#sa').innerHTML = table([{h:'LP',k:'lp'},{h:'Type',k:'lp_type'},{h:'Commitments',k:'n',n:1},{h:'$m',k:'usd_m',n:1,f:r=>num(r.usd_m)},{h:'Latest',k:'latest'}], S.active_lps);
    $('#sr').innerHTML = table([{h:'Date',k:'date_committed'},{h:'LP',k:'lp'},{h:'Fund',k:'fund_name'},{h:'Manager',k:'manager'},{h:'Strategy',k:'strategy'},{h:'Themes',k:'themes'},{h:'Geography',k:'geography'},{h:'$m',k:'amount_usd_m',n:1,f:r=>num(r.amount_usd_m,1)},
      {h:'Source',k:'source_url',f:r=>r.source_url?`<a href="${esc(r.source_url)}" target="_blank" rel="noopener">link</a>`:''}], S.recent_commitments);

// ---------- shortlist, cards, drafts ----------
let LASTQ = {}, LASTR = null;
function loadShort(){ try { return JSON.parse(localStorage.getItem('lp_shortlist')||'{}'); } catch(e){ return {}; } }
function saveShort(S){ try { localStorage.setItem('lp_shortlist', JSON.stringify(S)); } catch(e){} }
function addShort(it){ const S = loadShort(); if (!S[it.name]) S[it.name] = {...it, status:'To contact', notes:'', added:new Date().toISOString().slice(0,10)}; saveShort(S); toast('Added to shortlist: ' + it.name); }
function toast(t){ let d=document.createElement('div'); d.textContent=t; d.style.cssText='position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;z-index:20;font-size:13px'; document.body.appendChild(d); setTimeout(()=>d.remove(),2200); }
function lpCard(d, i){
  const cts = (d.contacts||[]).filter(c=>c.contact_name||c.email).slice(0,4);
  const snap = {name:d.lp, kind:d.lp_type, country:d.country, why:(d.examples||[]).slice(0,3).map(e=>e.fund_name+(e.vintage?' ('+e.vintage+')':'')).join('; '), contacts:cts, ticket:d.median_ticket_usd_m, match:d.match};
  return `<div class="lp"><div class="top">
    <span class="name">${esc(d.lp)}</span><span class="meta">${esc(d.lp_type)} · ${esc(d.country)}</span>
    <span class="meta">match <span class="score">${d.match}</span><span class="meter"><i style="width:${d.match}%"></i></span></span>
    <span class="meta">${d.n_similar} similar commitments${d.median_ticket_usd_m?` · typical ticket $${num(d.median_ticket_usd_m,1)}m`:''}</span>
    ${d.flags.map(f=>`<span class="flag">${esc(f)}</span>`).join('')}
    <button class="btn sm" onclick='addShort(${JSON.stringify(snap).replace(/'/g,"&#39;")})'>Shortlist</button>
    <button class="btn sm" onclick="draftEmail(${i})">Draft email</button></div>
    <ul>${d.examples.map(e=>`<li>${esc(e.fund_name)}${e.manager?' ('+esc(e.manager)+')':''} · ${e.vintage||''} · ${e.amount_usd_m?'$'+num(e.amount_usd_m,1)+'m':''} <span class="meta">${esc(e.themes||'')} · ${esc(e.geography||'')}</span>${e.source_url?` · <a href="${esc(e.source_url)}" target="_blank" rel="noopener">source</a>`:''}</li>`).join('')}</ul>
    ${cts.length?`<div class="contacts">${cts.map(c=>`<div>${esc(c.contact_name||c.team||'General')}${c.title?' · <span class="meta">'+esc(c.title)+'</span>':''}${c.email?' · <a href="mailto:'+esc(c.email)+'">'+esc(c.email)+'</a>':''}${c.phone?' · '+esc(c.phone):''}${c.source_url?' · <a href="'+esc(c.source_url)+'" target="_blank" rel="noopener">source</a>':''}</div>`).join('')}</div>`:''}
  </div>`;
}
async function draftEmail(i){
  const d = LASTR.public_lps[i];
  const r = await api('/api/draft_email?' + qs({strategy:LASTQ.strategy, geography:LASTQ.geography, themes:LASTQ.themes, stage:LASTQ.stage, fund_size_m:LASTQ.fund_size_m, emerging:LASTQ.emerging, lp:d.lp, fund_name:LASTQ.fund_name}));
  const to = r.to && r.to.email ? r.to.email : '';
  openDrawer(`<h3>Draft to ${esc(d.lp)}</h3><div class="sub">${r.to&&r.to.contact_name?esc(r.to.contact_name)+(r.to.title?' · '+esc(r.to.title):''):'No named contact published; address it to the team or use the published channel.'}</div>
    <label class="meta">Subject</label><input id="esub" value="${esc(r.subject)}" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);margin:4px 0 10px">
    <textarea id="ebody">${esc(r.body)}</textarea>
    <div style="margin-top:10px;display:flex;gap:8px"><button class="btn" onclick="navigator.clipboard.writeText($('#esub').value+'\n\n'+$('#ebody').value).then(()=>toast('Copied'))">Copy</button>
    ${to?`<a class="btn" href="mailto:${esc(to)}?subject=${encodeURIComponent(r.subject)}&body=${encodeURIComponent(r.body)}">Open in mail</a>`:''}</div>
    <p class="note">Edit before sending. It cites the LP's comparable commitments from public sources; check each one is still accurate.</p>`);
}
function exportShortCsv(items){
  const head = ['Company name','First Name','Last Name','Job Title','Email','Phone Number','Country/Region','Lifecycle Stage','Lead Status','LP type','Match score','Typical ticket (USD m)','Why','Status','Notes','Website'];
  const q = v => '"' + String(v==null?'':v).replace(/"/g,'""') + '"';
  const lines = [head.map(q).join(',')];
  const leadStatus = {'To contact':'NEW','Contacted':'ATTEMPTED_TO_CONTACT','Replied':'CONNECTED','Meeting':'IN_PROGRESS','Due diligence':'IN_PROGRESS','Committed':'CONNECTED','Passed':'UNQUALIFIED'};
  items.forEach(it => { const cs = (it.contacts&&it.contacts.length)?it.contacts:[{}];
    cs.forEach(c => { const n = (c.contact_name||'').split(' ');
      lines.push([it.name, c.contact_name?n[0]:'', c.contact_name?n.slice(1).join(' '):'', c.title||'', c.email||'', c.phone||'', it.country||'', 'lead', leadStatus[it.status]||'NEW', it.kind||'', it.match||'', it.ticket||'', it.why||'', it.status||'', it.notes||'', it.website||''].map(q).join(',')); }); });
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([lines.join('\n')], {type:'text/csv'})); a.download = 'lp-shortlist-hubspot.csv'; a.click();
}
async function showCheck(crd){
  const r = await api('/api/manager_check/' + encodeURIComponent(crd));
  const m = r.manager, s = r.summary, c = r.contact||{};
  const prov = (k,l) => r.providers[k].length ? `<dt>${l}</dt><dd>${r.providers[k].map(p=>esc(p[0])+' ('+p[1]+')').join('; ')}</dd>` : '';
  openDrawer(`<h3>${esc(m.adviser_name)}</h3><div class="sub">${esc(m.adviser_type)} · ${esc(m.city)}, ${esc(m.country)} · <a href="${r.sec_profile}" target="_blank" rel="noopener">SEC profile</a></div>
    <div class="tiles" style="grid-template-columns:repeat(4,1fr)"><div class="tile"><b>${s.n_funds}</b><span>active funds</span></div><div class="tile"><b>$${num(s.gross_assets_usd/1e9,1)}bn</b><span>gross fund assets</span></div>
      <div class="tile"><b>${s.first_on_record||''}</b><span>first fund on record</span></div><div class="tile"><b>${s.latest_fund_filed||''}</b><span>latest fund filed</span></div></div>
    ${r.positives.length?`<h4>Points in its favour</h4><ul>${r.positives.map(x=>`<li class="ok">${esc(x)}</li>`).join('')}</ul>`:''}
    ${r.flags.length?`<h4>Points to probe</h4><ul>${r.flags.map(x=>`<li class="warn">${esc(x)}</li>`).join('')}</ul>`:''}
    <h4>Investor base (medians across funds)</h4><dl><dt>Investors per fund</dt><dd>${num(s.median_investors)}</dd><dt>Held by funds of funds</dt><dd>${pct(s.median_pct_fof)}</dd>
      <dt>Held by non-US investors</dt><dd>${pct(s.median_pct_non_us)}</dd><dt>Held by manager / related</dt><dd>${pct(s.median_pct_manager)}</dd><dt>Minimum investment</dt><dd>${s.median_min_investment?'$'+num(s.median_min_investment):''}</dd>
      <dt>Fund types</dt><dd>${esc(s.fund_types.join(', '))}</dd><dt>Domiciles</dt><dd>${esc(s.domiciles.join(', '))}</dd></dl>
    <h4>Service providers</h4><dl>${prov('auditor','Auditor')}${prov('administrator','Administrator')}${prov('custodian','Custodian')}${prov('placement_agent','Placement agent')}</dl>
    ${c.phone||c.websites?`<h4>Firm contact (SEC filing)</h4><dl><dt>Office</dt><dd>${esc([c.street,c.city,c.postal,c.country].filter(Boolean).join(', '))}</dd><dt>Phone</dt><dd>${esc(c.phone)}</dd><dt>Website</dt><dd>${esc(c.websites)}</dd><dt>Chief compliance officer</dt><dd>${esc(c.cco_name)}</dd></dl>`:''}
    <h4>Public LPs backing its funds</h4>${r.lp_backers.length?table([{h:'LP',k:'lp'},{h:'Fund',k:'fund_name'},{h:'Vintage',k:'vintage'},{h:'$m',k:'amount_usd_m',n:1,f:x=>num(x.amount_usd_m,1)},{h:'IRR',k:'net_irr'}], r.lp_backers):'<div class="note">None matched by name.</div>'}
    <h4>Funds</h4><div id="ckf"></div><p class="note">Source: SEC Form ADV Schedule D, filings to Dec 2024.</p>`);
  const el = $('#ckf'); el.innerHTML = table([{h:'Fund',k:'fund_name'},{h:'Type',k:'fund_type'},{h:'Domicile',k:'domicile_country'},{h:'$m',k:'gross_assets_usd',n:1,f:x=>num(x.gross_assets_usd/1e6,1)},{h:'Investors',k:'beneficial_owners',n:1},{h:'% FoF',k:'pct_owned_by_fund_of_funds',n:1,f:x=>pct(x.pct_owned_by_fund_of_funds)},{h:'First filed',k:'first_reported'}], r.funds, true);
  bindRows(el, r.funds, x => showFund(x.fund_id));
}

// ---------- detail drawers ----------
function openDrawer(html) { $('#dbody').innerHTML = html; $('#drawer').classList.add('open'); $('#drawer').scrollTop = 0; }
function closeDrawer() { $('#drawer').classList.remove('open'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
const yn = v => v === 'Y' ? 'Yes' : v === 'N' ? 'No' : esc(v);

async function showFund(id) {
  const f = await api('/api/fund/' + encodeURIComponent(id));
  const flags = [f.deeptech_kw&&'deep tech (keyword)', f.india_link&&'India-linked', f.near_home&&'Monaco/FR/CH/LU link'].filter(Boolean).map(x=>`<span class="pill">${x}</span>`).join('');
  openDrawer(`<h3>${esc(f.fund_name)}</h3><div class="sub">${esc(f.fund_type)} · ${esc(f.domicile_country)} · SEC fund ID ${esc(f.fund_id)} ${flags}</div>
    <h4>Setup</h4><dl>
      <dt>Manager</dt><dd><a href="#" onclick="showCheck('${esc(f.adviser_crd)}');return false">${esc(f.adviser_name)}</a> (${esc(f.adviser_type)}, ${esc(f.adviser_city)}, ${esc(f.adviser_country)})</dd>
      <dt>GP / general partner entities</dt><dd>${esc(f.gp_entities)}</dd>
      <dt>Master / feeder</dt><dd>Master: ${yn(f.is_master)} · Feeder: ${yn(f.is_feeder)}${f.master_fund_name?' · master fund: '+esc(f.master_fund_name):''}</dd>
      <dt>Fund of funds</dt><dd>${yn(f.is_fund_of_funds)}</dd>
      <dt>US exemption</dt><dd>3(c)(1): ${yn(f.exemption_3c1)} · 3(c)(7): ${yn(f.exemption_3c7)}</dd>
      <dt>Auditor</dt><dd>${esc(f.auditor)}</dd><dt>Administrator</dt><dd>${esc(f.administrator)}</dd>
      <dt>Custodian</dt><dd>${esc(f.custodian)}</dd><dt>Prime broker</dt><dd>${esc(f.prime_broker)}</dd>
      <dt>Placement agent</dt><dd>${esc(f.placement_agent) || (f.uses_placement_agent==='N'?'None reported':'')}</dd>
      <dt>Form D file numbers</dt><dd>${esc(f.form_d_file_numbers)}</dd>
      <dt>Reported on ADV</dt><dd>${esc(f.first_reported)} to ${esc(f.last_reported)}</dd></dl>
    <h4>Size and investors</h4><dl>
      <dt>Gross assets</dt><dd>$${num(f.gross_assets_usd/1e6,1)}m</dd>
      <dt>Minimum investment</dt><dd>${f.min_investment_usd!=null?'$'+num(f.min_investment_usd):''}</dd>
      <dt>Number of investors</dt><dd>${num(f.beneficial_owners)}</dd>
      <dt>Owned by manager / related</dt><dd>${pct(f.pct_owned_by_manager)}</dd>
      <dt>Owned by funds of funds</dt><dd>${pct(f.pct_owned_by_fund_of_funds)}</dd>
      <dt>Owned by non-US investors</dt><dd>${pct(f.pct_owned_non_us)}</dd></dl>
    <h4>LP commitments in the database</h4>${f.commitments.length ? table([{h:'LP',k:'lp'},{h:'Vintage',k:'vintage'},{h:'$m',k:'amount_usd_m',n:1,f:r=>num(r.amount_usd_m,1)},{h:'IRR',k:'net_irr'},{h:'Multiple',k:'multiple'},{h:'As of',k:'as_of'}], f.commitments) : '<div class="note">None matched by name.</div>'}
    <h4>Other funds from this manager</h4>${table([{h:'Fund',k:'fund_name'},{h:'Type',k:'fund_type'},{h:'$m',k:'gav_musd',n:1,f:r=>num(r.gav_musd,1)},{h:'First filed',k:'first_reported'}], f.siblings)}
    <p class="note">Source: SEC Form ADV Schedule D 7.B.1, latest filing up to Dec 2024.</p>`);
  $('#dbody').querySelectorAll('table').forEach((t, i, all) => { if (i === all.length-1) t.querySelectorAll('tbody tr').forEach((tr,j) => { tr.classList.add('click'); tr.onclick = () => showFund(f.siblings[j].fund_id); }); });
}

async function showManager(crd) {
  const m = await api('/api/manager/' + encodeURIComponent(crd));
  openDrawer(`<h3>${esc(m.adviser_name)}</h3><div class="sub">${esc(m.adviser_type)} · ${esc(m.city)}, ${esc(m.country)} · CRD ${esc(m.crd)}</div>
    <dl><dt>Legal name</dt><dd>${esc(m.adviser_legal_name)}</dd><dt>Regulatory AUM</dt><dd>${m.regulatory_aum?'$'+num(m.regulatory_aum/1e6)+'m':''}</dd>
    <dt>Active funds</dt><dd>${num(m.n_active_funds)} ($${num(m.active_fund_gav/1e6)}m gross)</dd><dt>Fund domiciles</dt><dd>${esc(m.fund_domiciles)}</dd>
    <dt>Last ADV filing</dt><dd>${esc(m.last_filed)}</dd><dt>SEC record</dt><dd><a href="https://adviserinfo.sec.gov/firm/summary/${esc(m.crd)}" target="_blank" rel="noopener">IAPD profile</a></dd></dl>
    <h4>LP commitments to this manager's funds</h4>${m.lp_commitments.length ? table([{h:'LP',k:'lp'},{h:'Fund',k:'fund_name'},{h:'Vintage',k:'vintage'},{h:'$m',k:'amount_usd_m',n:1,f:r=>num(r.amount_usd_m,1)}], m.lp_commitments) : '<div class="note">None matched by name.</div>'}
    <h4>Funds</h4><div id="mf"></div>`);
  const el = $('#mf');
  el.innerHTML = table([{h:'Fund',k:'fund_name'},{h:'Type',k:'fund_type'},{h:'Domicile',k:'domicile_country'},{h:'$m',k:'gav_musd',n:1,f:r=>num(r.gav_musd,1)},
    {h:'Investors',k:'beneficial_owners',n:1,f:r=>num(r.beneficial_owners)},{h:'% FoF',k:'pct_owned_by_fund_of_funds',n:1,f:r=>pct(r.pct_owned_by_fund_of_funds)},{h:'% non-US',k:'pct_owned_non_us',n:1,f:r=>pct(r.pct_owned_non_us)}], m.funds, true);
  bindRows(el, m.funds, r => showFund(r.fund_id));
}

// ---------- routing ----------
function setView(v, arg) {
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  closeDrawer();
  $('#main').innerHTML = '<div class="empty">Loading…</div>';
  views[v](arg).catch(e => $('#main').innerHTML = `<div class="empty">Error: ${esc(e.message)}</div>`);
}
document.querySelectorAll('#nav button').forEach(b => b.onclick = () => setView(b.dataset.v));
api('/api/facets').then(f => { FACETS = f; setView('match'); });
</script>
</body>
</html>
