<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fund Desk · Sign in</title>
<style>
  :root { --bg:#f6f5f2; --panel:#ffffff; --ink:#1c1c1a; --muted:#6b6a65; --line:#e3e1db; --accent:#0C2340; --err:#a33; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141413; --panel:#1d1d1b; --ink:#ecebe7; --muted:#9b9a94; --line:#2e2e2b; --accent:#C5A059; --err:#e88; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
         font:15px/1.5 -apple-system, "Segoe UI", Inter, Roboto, sans-serif; padding:16px; }
  form { width:100%; max-width:340px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:28px; }
  h1 { font-size:18px; margin:0 0 4px; font-weight:600; }
  p { margin:0 0 20px; color:var(--muted); font-size:13px; }
  label { display:block; font-size:12px; color:var(--muted); margin:14px 0 6px; }
  input { width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:6px; background:transparent; color:var(--ink); font:inherit; }
  input:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  button { margin-top:20px; width:100%; padding:10px; border:0; border-radius:6px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  @media (prefers-color-scheme: dark) { button { color:#111; } }
  .ic { display:flex; align-items:center; gap:8px; font-size:10.5px; letter-spacing:.18em; text-transform:uppercase; font-weight:600; color:#8a6d2f; margin-bottom:14px; }
  .icm { display:inline-grid; place-items:center; width:24px; height:24px; border:1.5px solid #C5A059; border-radius:2px; color:#C5A059; font-family:Georgia,serif; font-size:10px; letter-spacing:0; font-weight:700; }
  h1 { font-family:Georgia,serif; }
  @media (prefers-color-scheme: dark) { .ic { color:#E6CD8E; } }
  .err { color:var(--err); font-size:13px; min-height:18px; margin-top:12px; }
</style>
</head>
<body>
<form method="post" action="/login">
  <div class="ic"><span class="icm" aria-hidden="true">I&amp;C</span>Icons &amp; Company</div>
  <h1>Fund Desk</h1>
  <p>Fund Desk and LP Portal. Sign in with your user ID.</p>
  <input type="hidden" name="next" value="{{next}}">
  <label for="u">User ID</label>
  <input id="u" name="username" autocomplete="username" required autofocus>
  <label for="p">Password</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required>
  <button type="submit">Sign in</button>
  <div class="err">{{error}}</div>
</form>
</body>
</html>
