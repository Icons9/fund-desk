<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="fd-mode" content="learn">
<title>Fund Desk · Learn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
/* Layout: header (search + views) / area filter / main stage (graph, learn, lifecycle, legal, chains) + reading panel on the right. */
:root{
  --bg:#eceef0; --surface:#fafbfc; --ink:#131a23; --muted:#5a6472; --line:#d3d8de;
  --accent:#1f4fd1; --accent-soft:#e3e9fb; --good:#1d7a4c; --good-soft:#dff1e7;
  --display:"Newsreader", Georgia, "Times New Roman", serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1217; --surface:#161b22; --ink:#e5e8ed; --muted:#97a1ae; --line:#29303a;
    --accent:#8aa5ff; --accent-soft:#1d2640; --good:#5cc98f; --good-soft:#14301f; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1217; --surface:#161b22; --ink:#e5e8ed; --muted:#97a1ae; --line:#29303a;
  --accent:#8aa5ff; --accent-soft:#1d2640; --good:#5cc98f; --good-soft:#14301f; color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;display:flex;flex-direction:column}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance}

header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.brand h1{font-family:var(--display);font-weight:600;font-size:22px;margin:0;line-height:1.1}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.search{position:relative;flex:1 1 240px;max-width:380px}
.search input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.results{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.14);z-index:30;padding:4px;display:none;max-height:360px;overflow:auto}
.results.open{display:block}
.results button{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;background:none;border:0;padding:7px 8px;border-radius:6px;cursor:pointer}
.results button[aria-selected="true"],.results button:hover{background:var(--accent-soft)}
.results small{color:var(--muted);margin-left:auto;white-space:nowrap}
.tabs{display:flex;flex-wrap:wrap;gap:3px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px}
.tabs button{border:0;background:none;padding:5px 11px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:500}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.filters{display:flex;flex-wrap:wrap;gap:5px;padding:7px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:2px 9px;font-size:12.5px;cursor:pointer}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.chip[aria-pressed="false"]{opacity:.42}
.chip.all{font-weight:500}

main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 410px}
.stage{position:relative;min-height:0;overflow:hidden}
.view{position:absolute;inset:0;display:none}
.view.on{display:block}
#graphWrap{position:absolute;inset:0}
canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
canvas.dragging{cursor:grabbing}
.zoom{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:4px}
.zoom button{width:34px;height:34px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;font-size:16px}
.hint{position:absolute;left:14px;bottom:14px;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
.chainbar{position:absolute;left:14px;top:14px;right:64px;display:none;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:6px 10px;font-size:13px;max-width:520px}
.chainbar.on{display:flex}
.chainbar button{margin-left:auto;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:2px 8px;cursor:pointer;font-size:12px}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px}

.scroll{overflow:auto;height:100%;padding:20px 22px 40px}
.wrapw{max-width:1100px}
.sec-title{font-family:var(--display);font-weight:600;font-size:26px;margin:0 0 4px}
.lead{margin:0 0 14px;color:var(--muted);max-width:75ch}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.card h3{font-family:var(--display);font-weight:600;font-size:19px;margin:0;line-height:1.2}
.card p{margin:0;color:var(--muted);font-size:14px}
.card .steps{font-size:12.5px;color:var(--muted)}
.card .row{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:13px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0e1217}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0e1217}}
.btn.good{background:var(--good-soft);border-color:var(--good);color:var(--good)}

/* Learn matrix */
.prog{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 16px}
.prog div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:120px}
.prog b{display:block;font-family:var(--mono);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.prog span{font-size:12px;color:var(--muted)}
.mx-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.mx{border-collapse:collapse;width:100%;min-width:640px;font-size:13.5px}
.mx th,.mx td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.mx thead th{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--bg)}
.mx tbody tr:last-child td{border-bottom:0}
.mx .cat{display:flex;align-items:center;gap:8px;font-weight:500;white-space:nowrap}
.cell{width:100%;border:1px solid transparent;background:none;border-radius:6px;padding:4px 6px;cursor:pointer;text-align:left}
.cell:hover{border-color:var(--line);background:var(--bg)}
.cell[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.cell .n{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:3px;background:var(--line);margin-top:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good)}
.cell.empty{color:var(--muted);cursor:default}
.lvl{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.03em;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.learn-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:18px 0 8px}
.learn-bar h3{margin:0;font-size:16px;font-weight:600}
.learn-bar input{padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px;min-width:200px}
.tlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.titem{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;cursor:pointer}
.titem:hover{border-color:var(--accent)}
.titem .dot{margin-top:6px}
.titem b{font-weight:600}
.titem p{grid-column:2/4;margin:0;color:var(--muted);font-size:13px}
.titem .ok{color:var(--good);font-size:12px;font-weight:600}
.empty-note{color:var(--muted)}

/* Lifecycle */
.stepper{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;margin:0 0 14px}
.step{flex:none;display:flex;flex-direction:column;gap:2px;min-width:132px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;cursor:pointer;position:relative}
.step .num{font-family:var(--mono);font-size:11px;color:var(--accent)}
.step b{font-size:13.5px;font-weight:600;line-height:1.25}
.step small{font-size:11.5px;color:var(--muted)}
.step[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.stage-head{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline;margin-bottom:6px}
.stage-head h2{font-family:var(--display);font-weight:600;font-size:28px;margin:0}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.meta span{font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.goal{font-size:16px;margin:4px 0 6px;font-weight:500}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:14px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.box h3,.panel h3,.rel h3{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 6px}
.box ul{margin:0;padding-left:18px}
.box li{margin:3px 0;font-size:14px}
.box.warn{border-left:3px solid #c43a55}
.box.comp{border-left:3px solid var(--accent)}
.checks label{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin:5px 0;cursor:pointer}
.checks input{margin-top:3px}
.nav-row{display:flex;justify-content:space-between;gap:8px;margin-top:16px}

/* Legal */
.subtabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.subtabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13.5px}
.subtabs button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.jpills{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.jpills button{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:13.5px}
.jpills button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:500}
table.kv{width:100%;border-collapse:collapse;font-size:13.5px}
.kv td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.kv td:first-child{color:var(--muted);width:45%}
.kv td:last-child{font-variant-numeric:tabular-nums}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.timeline li:last-child{border-bottom:0}
.timeline b{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--accent)}
.tmx-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);max-height:70vh}
table.tmx{border-collapse:collapse;font-size:13px;min-width:1100px}
.tmx th,.tmx td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:7px 9px;vertical-align:top;text-align:left}
.tmx thead th{position:sticky;top:0;background:var(--bg);font-size:12px;font-weight:600;z-index:1}
.tmx tbody th{position:sticky;left:0;background:var(--surface);min-width:170px;font-weight:600}
.tmx tbody th small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.cal{display:flex;flex-direction:column;gap:6px}
.calrow{display:grid;grid-template-columns:170px 90px 1fr;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px}
.calrow .when{font-weight:600;font-size:13px}
.calrow .tag{font-size:11.5px;color:var(--muted)}
.calrow small{display:block;color:var(--muted);font-size:12px}
.note{font-size:12.5px;color:var(--muted);margin:14px 0 0}

/* Panel */
aside{border-left:1px solid var(--line);background:var(--surface);overflow:auto;min-height:0}
.panel{padding:20px 22px 40px;max-width:65ch}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.panel h2{font-family:var(--display);font-weight:600;font-size:28px;line-height:1.15;margin:6px 0 4px}
.aka{color:var(--muted);font-size:13px;margin:0 0 12px}
.def{margin:0 0 14px}
.exs{display:grid;gap:8px;margin:0 0 16px}
.ex{background:var(--bg);border-left:3px solid var(--accent);border-radius:0 6px 6px 0;padding:8px 12px;font-size:14px}
.ex b{display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:2px}
.scen{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0 0 8px;background:var(--surface)}
.scen p{margin:0 0 8px;font-size:14px}
.scen .out{display:none;margin:8px 0 0;padding-top:8px;border-top:1px dashed var(--line);font-size:14px}
.scen.open .out{display:block}
.scen .btn{font-size:12.5px;padding:3px 9px}
.links{display:flex;flex-wrap:wrap;gap:6px}
.tlink{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:3px 9px;font-size:13.5px;cursor:pointer;text-align:left}
.tlink:hover{border-color:var(--accent)}
.rel h3{margin-top:16px}
.study{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 0;padding-top:14px;border-top:1px solid var(--line)}
ol.steps{list-style:none;padding:0;margin:10px 0 0;counter-reset:s}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
ol.steps li::before{content:counter(s);font-family:var(--mono);font-size:12px;color:var(--accent);border:1px solid var(--accent);border-radius:50%;width:22px;height:22px;display:grid;place-items:center}
ol.steps p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stats div{background:var(--bg);border-radius:8px;padding:8px 10px}
.stats b{display:block;font-family:var(--mono);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}
.muted{color:var(--muted)}
.calc{margin-top:18px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--bg)}
.calc .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.calc label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:3px}
.calc input{font-family:var(--mono);font-size:14px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);width:100%}
.calc table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13.5px}
.calc th,.calc td{padding:5px 4px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.calc th:first-child,.calc td:first-child{text-align:left}
.calc td{font-family:var(--mono);font-size:13px}
.calc td:first-child{font-family:var(--body);font-size:13.5px}
.calc tfoot td{font-weight:600;border-bottom:0}


/* Learn (course layout) */
.overall{margin:0 0 14px}
.ov-bar{display:flex;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.ov-bar i{display:block;height:100%}
.ov-bar .k,.sw.k{background:var(--good)}
.ov-bar .r,.sw.r{background:#d9a23a}
.sw.n{background:var(--line)}
.ov-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:6px;font-size:13px;color:var(--muted)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.continue{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:14px 16px;margin:0 0 10px}
.continue.alt{border-left-color:#d9a23a}
.continue div{display:flex;flex-direction:column;gap:2px}
.continue b{font-size:17px}
.continue .muted{font-size:13px}
.btn.big{padding:9px 16px;font-size:14.5px}
.h-sub{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:22px 0 8px}
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.levels button{display:flex;flex-direction:column;gap:3px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;cursor:pointer}
.levels button b{font-size:15px}
.levels button span{font-size:12.5px;color:var(--muted)}
.levels button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.mini{display:block;height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:4px}
.mini i{display:block;height:100%;background:var(--good)}
.level-desc{color:var(--muted);margin:10px 0 14px;max-width:75ch}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.mod{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.mod.done{border-color:var(--good)}
.mod-top{display:flex;align-items:center;gap:8px}
.mod-top .num{font-family:var(--mono);font-size:11px;color:var(--muted)}
.mod-top b{font-size:15px}
.mod-meta{margin:0;font-size:13px;color:var(--muted)}
.mod-peek{margin:0;font-size:12.5px;color:var(--muted);flex:1}
.mod .row{display:flex;gap:6px;margin-top:4px}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good)}
.bar.big{height:7px;margin:8px 0 14px}
.browse{margin-top:22px;border-top:1px solid var(--line);padding-top:12px}
.browse summary{cursor:pointer;font-weight:600}
.browse input{display:block;margin:10px 0;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px;width:min(100%,360px)}
.titem .rv{color:#b07d1c;font-size:12px;font-weight:600}
.study-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.study-top b{flex:1;font-size:15px}
.mono{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 24px;max-width:760px}
.fcard h2{font-family:var(--display);font-weight:600;font-size:32px;line-height:1.15;margin:8px 0 4px}
.fcard h3{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:16px 0 6px}
.fc-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.badge{font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px}
.badge.known{background:var(--good-soft);color:var(--good)}
.badge.review{background:#f6e7c8;color:#8a5d0c}
.small{font-size:13px;margin:-2px 0 8px}
.fc-q{margin:20px 0 8px;font-weight:600}
.fc-actions{display:flex;flex-wrap:wrap;gap:8px}
.fc-actions.left{margin-top:14px}
.fc-nav{display:flex;justify-content:space-between;gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid var(--line);flex-wrap:wrap}
.linkbtn{background:none;border:0;color:var(--accent);cursor:pointer;font-size:13.5px;padding:2px 0}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;margin-left:4px;color:var(--muted);background:var(--bg)}
.qprompt{font-size:17px;line-height:1.55;margin:4px 0 16px}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;cursor:pointer;font-size:15px}
.opt kbd{margin:0}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:#c43a55;background:rgba(196,58,85,.1)}
.feedback{margin:14px 0 10px;padding:10px 12px;border-radius:8px;font-size:14px}
.feedback.ok{background:var(--good-soft)}
.feedback.no{background:rgba(196,58,85,.1)}
.done-card h2{margin-top:0}
.howto{padding-left:20px;margin:8px 0 0}
.howto li{margin:6px 0;font-size:14px}
@media (max-width:640px){.levels{grid-template-columns:1fr}.fcard{padding:16px}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .badge.review{background:#3a2c10;color:#e8b860}}
:root[data-theme="dark"] .badge.review{background:#3a2c10;color:#e8b860}


.backlink{display:inline-block;font-size:12.5px;color:var(--accent);text-decoration:none;margin-top:2px}
.backlink:hover{text-decoration:underline}
/* Videos */
.vids{margin:16px 0 4px}
.vbox{margin-top:14px;max-width:820px}
.vbox .vids{margin:0}
.vid{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:center;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;margin:0 0 6px;text-decoration:none;color:var(--ink)}
.vid:hover{border-color:#c4302b}
.vid b{display:block;font-size:14px;font-weight:600;line-height:1.3}
.vid small{display:block;font-size:12px;color:var(--muted)}
.play{display:inline-block;width:36px;height:25px;border-radius:7px;background:#c4302b;position:relative;flex:none}
.play::after{content:"";position:absolute;left:14px;top:6.5px;border-left:10px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent}
.play.sm{width:22px;height:15px;border-radius:4px;vertical-align:-2px;margin-right:6px}
.play.sm::after{left:8.5px;top:3.5px;border-left-width:6px;border-top-width:4px;border-bottom-width:4px}
.vmore{display:inline-block;font-size:13px;color:var(--accent);text-decoration:none;margin-top:2px}
.vmore:hover{text-decoration:underline}
.mvid{font-size:12.5px;color:var(--ink);text-decoration:none;line-height:1.35}
.mvid:hover{color:var(--accent)}
/* Desk */
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ncard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.ncard.wide{max-width:820px}
.ncard h3{font-family:var(--display);font-size:18px;font-weight:600;margin:0 0 4px}
.ntag{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.item{padding:9px 0;border-bottom:1px solid var(--line)}
.item:last-of-type{border-bottom:0}
.item a{color:var(--ink);font-weight:600;font-size:14.5px;line-height:1.35;text-decoration:none}
.item a:hover{text-decoration:underline;color:var(--accent)}
.item .d{font-size:12px;color:var(--muted);margin-top:2px}
.tchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tchip{display:inline-flex;align-items:center;gap:5px;border:1px dashed var(--line);background:var(--bg);border-radius:999px;padding:2px 9px;font-size:12px;cursor:pointer}
.tchip:hover{border-color:var(--accent);border-style:solid}
.nfoot{margin-top:8px;font-size:13px}
.nfoot a,.srcs a,.lib a,.lgrid a{color:var(--accent);text-decoration:none}
.nfoot a:hover,.srcs a:hover,.lib a:hover{text-decoration:underline}
.gchips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.gchip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 11px;font-size:13px;color:var(--ink);text-decoration:none}
.gchip:hover{border-color:var(--accent)}
.srcs{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;margin-top:4px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mtile{display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-decoration:none;color:var(--ink)}
.mtile:hover{border-color:var(--accent)}
.mtile b{font-size:15px}
.mtile span{font-size:12px;color:var(--muted)}
.rtable{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.rtable table{width:100%;border-collapse:collapse;font-size:14px}
.rtable th{text-align:left;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--bg);padding:8px 10px;border-bottom:1px solid var(--line)}
.rtable td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.rtable tr:last-child td{border-bottom:0}
.rtable a{color:var(--accent);text-decoration:none}
.rtable .num{white-space:nowrap;font-variant-numeric:tabular-nums}
.newslink{font-weight:600}
.dsearch{display:block;width:min(100%,360px);padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px;margin:0 0 10px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.lib{padding:3px 0;font-size:14px}
.sheet-head{display:none}
.backdrop{display:none}

@media (max-width: 960px){
  html,body{height:auto}
  body{display:block}
  header{padding:10px 14px;gap:8px}
  .brand h1{font-size:20px}
  .brand p{font-size:12px}
  .search{flex:1 1 100%;max-width:none;order:3}
  .search kbd{display:none}
  .search input{font-size:16px}
  .tabs{order:4;flex-wrap:nowrap;overflow-x:auto;width:100%;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:none;padding:7px 12px}
  .filters{flex-wrap:nowrap;overflow-x:auto;padding:6px 14px;scrollbar-width:none}
  .filters .chip{flex:none}
  main{display:block}
  .stage{height:auto;overflow:visible}
  .view{position:static}
  #view-graph.on{display:block;position:relative;height:72vh;min-height:380px}
  .view .scroll{height:auto;overflow:visible;padding:16px 14px 40px}
  .hint{display:none}
  .chainbar{right:56px}
  .sec-title{font-size:23px}
  .jpills,.subtabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .jpills button,.subtabs button{flex:none}
  .ngrid,.grid2,.lgrid,.mods,.tlist,.cards{grid-template-columns:1fr}
  .mgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .calrow{grid-template-columns:1fr}
  .stage-head h2{font-size:24px}
  .fcard{padding:16px}
  .fcard h2{font-size:26px}
  .fc-actions .btn.big{flex:1 1 140px}
  .study-top b{flex-basis:100%;order:3}
  .rtable{border:0;background:none;overflow:visible}
  .rtable table,.rtable tbody,.rtable tr,.rtable td{display:block;width:100%}
  .rtable thead{display:none}
  .rtable tr{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin:0 0 8px;padding:8px 12px}
  .rtable td{border:0;padding:3px 0;display:grid;grid-template-columns:96px 1fr;gap:8px}
  .rtable td::before{content:attr(data-l);font-size:12px;color:var(--muted)}
  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:49}
  .backdrop.open{display:block}
  aside{position:fixed;left:0;right:0;bottom:0;height:86vh;height:86dvh;z-index:50;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.25);transform:translateY(105%);transition:transform .25s ease;overflow:auto;padding-bottom:env(safe-area-inset-bottom)}
  aside.open{transform:none}
  .sheet-head{display:flex;align-items:center;justify-content:flex-end;position:sticky;top:0;background:var(--surface);padding:8px 14px;border-bottom:1px solid var(--line);z-index:2}
  .grab{position:absolute;left:50%;top:6px;width:40px;height:4px;border-radius:2px;background:var(--line);transform:translateX(-50%)}
  .panel{padding:14px 16px 40px}
  .panel h2{font-size:24px}
  .zoom button{width:40px;height:40px}
}

function buildEdges(){
  const seen=new Set();
  const add=(s,t,type)=>{if(!byId[s]||!byId[t]||s===t)return;const k=[s,t].sort().join("|");if(seen.has(k))return;seen.add(k);edges.push({s:byId[s],t:byId[t],type})};
  EDGES.trim().split("\n").forEach(line=>{const [s,type,t]=line.trim().split(/\s+/);if(REL[type])add(s,t,type)});
  nodes.forEach(n=>n.r.forEach(ref=>{const [a,b]=ref.includes(":")?ref.split(":"):["see",ref];add(n.id,b,REL[a]?a:"see")}));
  nodes.forEach(n=>adj[n.id]=[]);
  edges.forEach(e=>{e.s.deg++;e.t.deg++;adj[e.s.id].push({other:e.t,label:REL[e.type][0]});adj[e.t.id].push({other:e.s,label:REL[e.type][1]})});
}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function layout(){
  const r=rng(7),keys=Object.keys(CATS),R=760,centers={};
  keys.forEach((k,i)=>{const a=i/keys.length*Math.PI*2-Math.PI/2;centers[k]={x:Math.cos(a)*R,y:Math.sin(a)*R}});
  nodes.forEach(n=>{const c=centers[n.cat];n.x=c.x+(r()-.5)*200;n.y=c.y+(r()-.5)*200});
  const N=nodes.length,T=320;
  for(let i=0;i<T;i++){
    const a=1-i/T;
    for(let p=0;p<N;p++){const u=nodes[p];
      for(let q=p+1;q<N;q++){const v=nodes[q];
        let dx=u.x-v.x,dy=u.y-v.y,d2=dx*dx+dy*dy;if(d2>90000)continue;if(d2<25)d2=25;
        const f=2200*a/d2,d=Math.sqrt(d2);dx/=d;dy/=d;u.vx+=dx*f;u.vy+=dy*f;v.vx-=dx*f;v.vy-=dy*f;}}
    edges.forEach(e=>{const dx=e.t.x-e.s.x,dy=e.t.y-e.s.y,d=Math.sqrt(dx*dx+dy*dy)||1,f=(d-90)*0.012*a;
      e.s.vx+=dx/d*f;e.s.vy+=dy/d*f;e.t.vx-=dx/d*f;e.t.vy-=dy/d*f;});
    nodes.forEach(n=>{const c=centers[n.cat];n.vx+=(c.x-n.x)*0.045*a;n.vy+=(c.y-n.y)*0.045*a;n.vx*=0.55;n.vy*=0.55;n.x+=n.vx;n.y+=n.vy;});
  }
  const sorted=[...nodes].sort((a,b)=>b.deg-a.deg);labelMinDeg=sorted[Math.min(28,sorted.length-1)].deg;
}
let labelMinDeg=99;
const radius=n=>3.5+Math.sqrt(n.deg)*1.6;

function hexA(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
function focusSet(){
  if(state.chain)return new Set(state.chain.steps.map(s=>s[0]));
  if(state.selected){const s=new Set([state.selected.id]);adj[state.selected.id].forEach(a=>s.add(a.other.id));return s}
  return null;
}
const alphaOf=(n,f)=>!state.cats.has(n.cat)?.06:(f&&!f.has(n.id)?.12:1);
function draw(){
  if(!ready||!W)return;
  const bg=tok("--bg"),ink=tok("--ink"),muted=tok("--muted"),line=tok("--line"),accent=tok("--accent");
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.translate(view.x,view.y);ctx.scale(view.k,view.k);
  const f=focusSet();
  ctx.lineWidth=1/view.k;
  edges.forEach(e=>{
    const hot=state.selected&&!state.chain&&(e.s===state.selected||e.t===state.selected);
    const a=Math.min(alphaOf(e.s,f),alphaOf(e.t,f));
    ctx.strokeStyle=hot?hexA(CATS[state.selected.cat].color,.9):line;
    ctx.globalAlpha=hot?1:(f?a*.5:.6);ctx.lineWidth=(hot?1.6:1)/view.k;
    ctx.beginPath();ctx.moveTo(e.s.x,e.s.y);ctx.lineTo(e.t.x,e.t.y);ctx.stroke();
  });
  ctx.globalAlpha=1;
  if(state.chain){
    const pts=state.chain.steps.map(s=>byId[s[0]]).filter(Boolean);
    ctx.strokeStyle=accent;ctx.lineWidth=2.6/view.k;ctx.setLineDash([6/view.k,4/view.k]);
    ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();ctx.setLineDash([]);
  }
  nodes.forEach(n=>{
    ctx.globalAlpha=alphaOf(n,f);ctx.fillStyle=CATS[n.cat].color;
    ctx.beginPath();ctx.arc(n.x,n.y,radius(n),0,Math.PI*2);ctx.fill();
    if(status[n.id]==="known"&&alphaOf(n,f)===1){ctx.strokeStyle=tok("--good");ctx.lineWidth=1.5/view.k;ctx.stroke()}
    if(n===state.selected||n===state.hover){ctx.strokeStyle=ink;ctx.lineWidth=2/view.k;ctx.stroke()}
  });
  ctx.globalAlpha=1;
  if(state.chain){
    ctx.font=`500 ${10/view.k}px ${tok("--mono")}`;ctx.textAlign="center";ctx.textBaseline="middle";
    state.chain.steps.forEach((s,i)=>{const n=byId[s[0]];if(!n)return;const bx=n.x-radius(n)-7/view.k,by=n.y-radius(n)-7/view.k;
      ctx.fillStyle=accent;ctx.beginPath();ctx.arc(bx,by,8/view.k,0,Math.PI*2);ctx.fill();ctx.fillStyle=bg;ctx.fillText(String(i+1),bx,by+.5/view.k);});
  }
  const fs=12/view.k;ctx.font=`500 ${fs}px ${tok("--body")}`;ctx.textAlign="left";ctx.textBaseline="middle";ctx.lineJoin="round";
  nodes.forEach(n=>{
    const a=alphaOf(n,f);
    const show=(f&&f.has(n.id))||n===state.hover||(!f&&a===1&&(n.deg>=labelMinDeg||view.k>1.4));
    if(!show)return;
    const tx=n.x+radius(n)+4/view.k;
    ctx.strokeStyle=bg;ctx.lineWidth=3.5/view.k;ctx.strokeText(n.label,tx,n.y);
    ctx.fillStyle=(f||n===state.hover)?ink:muted;
    if(n===state.selected)ctx.font=`600 ${fs*1.1}px ${tok("--body")}`;
    ctx.fillText(n.label,tx,n.y);
    if(n===state.selected)ctx.font=`500 ${fs}px ${tok("--body")}`;
  });
}
let raf=0;const redraw=()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;draw()})};
function resize(){
  const r=wrap.getBoundingClientRect();if(!r.width||!r.height)return;
  dpr=window.devicePixelRatio||1;W=r.width;H=r.height;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);

function bounds(l){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;l.forEach(n=>{x0=Math.min(x0,n.x);y0=Math.min(y0,n.y);x1=Math.max(x1,n.x);y1=Math.max(y1,n.y)});return{x0,y0,x1,y1}}
function fit(animate=true,list){
  if(!W)return;list=list||nodes.filter(n=>state.cats.has(n.cat));if(!list.length)list=nodes;
  const b=bounds(list),pad=list.length<14?150:50;
  const k=Math.min(2.2,Math.min(W/(b.x1-b.x0+pad*2),H/(b.y1-b.y0+pad*2)));
  tween({k,x:W/2-(b.x0+b.x1)/2*k,y:H/2-(b.y0+b.y1)/2*k},animate);
}
function tween(t,animate=true){
  if(!animate||reduced){view=t;redraw();return}
  const from={...view},t0=performance.now(),d=360;
  (function step(now){const p=Math.min(1,(now-t0)/d),e=1-Math.pow(1-p,3);
    view={k:from.k+(t.k-from.k)*e,x:from.x+(t.x-from.x)*e,y:from.y+(t.y-from.y)*e};draw();if(p<1)requestAnimationFrame(step)})(t0);
}
function centerOn(n){const k=Math.max(view.k,1.2);tween({k,x:W/2-n.x*k,y:H/2-n.y*k})}
const toWorld=(px,py)=>({x:(px-view.x)/view.k,y:(py-view.y)/view.k});
function hit(px,py){const w=toWorld(px,py);let best=null,bd=1e9;nodes.forEach(n=>{if(!state.cats.has(n.cat))return;const d=Math.hypot(n.x-w.x,n.y-w.y);if(d<radius(n)+5/view.k&&d<bd){bd=d;best=n}});return best}
let drag=null,pinch=null;const pts=new Map();

    const wx=(pinch.mx-pinch.vx)/pinch.k,wy=(pinch.my-pinch.vy)/pinch.k,mx=(a.x+b.x)/2,my=(a.y+b.y)/2;view={k,x:mx-wx*k,y:my-wy*k};redraw();return}

function calcHTML(){return `<div class="calc"><h3>Try it: European waterfall</h3><div class="grid">
  <label for="c-paid">Paid-in (€m)<input id="c-paid" type="number" min="0" step="1" value="100"></label>
  <label for="c-dist">Total proceeds (€m)<input id="c-dist" type="number" min="0" step="1" value="250"></label>
  <label for="c-years">Years held<input id="c-years" type="number" min="0" step="0.5" value="6"></label>
  <label for="c-hurdle">Hurdle (%)<input id="c-hurdle" type="number" min="0" step="0.5" value="8"></label>
  <label for="c-carry">Carry (%)<input id="c-carry" type="number" min="0" max="50" step="1" value="20"></label></div>
  <table><thead><tr><th>Tier</th><th>LPs</th><th>GP</th></tr></thead><tbody id="c-body"></tbody><tfoot id="c-foot"></tfoot></table>
  <p class="muted" style="font-size:12px;margin:8px 0 0">Simplified: all capital drawn on day one, one exit at the end, full catch-up. Real waterfalls run on dated cash flows.</p></div>`}
function waterfall(P,D,y,h,c){let r=Math.max(0,D);const roc=Math.min(r,P);r-=roc;const pref=P*(Math.pow(1+h,y)-1);const t2=Math.min(r,pref);r-=t2;
  const cu=c<1?c*t2/(1-c):0;const t3=Math.min(r,cu);r-=t3;return{roc,t2,t3,lp4:r*(1-c),gp4:r*c,lp:roc+t2+r*(1-c),gp:t3+r*c,profit:D-P}}
const fm=v=>"€"+v.toFixed(1)+"m";
function bindCalc(){const ids=["c-paid","c-dist","c-years","c-hurdle","c-carry"];
  const run=()=>{const [P,D,y,h,c]=ids.map(i=>parseFloat(document.getElementById(i).value)||0);const cc=Math.min(c,99);const w=waterfall(P,D,y,h/100,cc/100);
    document.getElementById("c-body").innerHTML=`<tr><td>1 · Return of capital</td><td>${fm(w.roc)}</td><td>–</td></tr><tr><td>2 · Preferred return</td><td>${fm(w.t2)}</td><td>–</td></tr><tr><td>3 · GP catch-up</td><td>–</td><td>${fm(w.t3)}</td></tr><tr><td>4 · ${100-cc}/${cc} split</td><td>${fm(w.lp4)}</td><td>${fm(w.gp4)}</td></tr>`;
    document.getElementById("c-foot").innerHTML=`<tr><td>Total</td><td>${fm(w.lp)}</td><td>${fm(w.gp)}</td></tr><tr><td colspan="3" style="text-align:left;font-weight:400;color:var(--muted);font-family:var(--body)">GP share: ${w.profit>0?(w.gp/w.profit*100).toFixed(1)+"% of profit":"no profit"}. LP net multiple ${P>0?(w.lp/P).toFixed(2)+"x":"–"}.</td></tr>`};
  ids.forEach(i=>document.getElementById(i).addEventListener("input",run));run()}

function mask(n){
  let ss=n.def.split(/(?<=\.)\s/);
  const acr=/^[A-Z0-9][A-Z0-9 .&\/-]{1,7}$/.test(n.label.replace(/\s*\(.*?\)/g,"").trim());
  if(acr&&ss.length>1&&ss[0].split(/\s+/).length<=8)ss=ss.slice(1);
  let t=ss.slice(0,2).join(" ");
  if(acr){const m=t.match(/^([^.:]{0,60}):\s*/);if(m&&m[1][0].toUpperCase()===n.label[0].toUpperCase()&&m[1].split(/\s+/).length<=5)t=t.slice(m[0].length);t=t.charAt(0).toUpperCase()+t.slice(1)}
  const words=[n.label,n.label.replace(/\s*\(.*?\)\s*/g," ").trim(),...(n.label.match(/\((.*?)\)/)||[]).slice(1),...n.aka.split(/,\s*/)].filter(w=>w&&w.length>2).sort((a,b)=>b.length-a.length);
  words.forEach(w=>{t=t.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"),"_____")});
  return t;
}
function startQuiz(cat,lvl,pool){

function score(n,s){const l=n.label.toLowerCase(),a=n.aka.toLowerCase();
  if(l===s)return 100;if(l.startsWith(s))return 80;if(a.split(/,\s*/).some(x=>x===s))return 78;if(l.includes(s))return 60;if(a.includes(s))return 50;if(n.def.toLowerCase().includes(s))return 20;return 0}
function search(){

  res.classList.add("open");
}

let NEWS=null,DESK=null,TERM_RX=[];

function buildMatcher(){
  const skip=new Set(["fund","exit","distribution","commitment","sourcing","screening","dilution","syndicate","lp","gp","manager","consultant"]);
  const pairs=[];
  nodes.forEach(n=>{
    const names=[n.label.replace(/\s*\(.*?\)/g,"").trim(),...(n.label.match(/\((.*?)\)/)||[]).slice(1),...n.aka.split(/,\s*/)];
    names.forEach(s=>{s=(s||"").trim();if(!s)return;const acr=/^[A-Z0-9&+]{2,6}$/.test(s);if(!acr&&s.length<4)return;if(skip.has(n.id)&&!acr)return;pairs.push([s,n.id,acr])});
  });
  const STOP=new Set(["discount","cap","PAI","pref","promote","reserves","warrants","core","IR","AI","PE","DD","FoF","CV fund"]);
  for(let i=pairs.length-1;i>=0;i--)if(STOP.has(pairs[i][0]))pairs.splice(i,1);
  [["secondaries","secondary-fund"],["oversubscribed","oversubscription"],["fundraising","fundraising-period"],["value creation","value-creation-plan"],["GP-led","gp-secondary"],["GP-leds","gp-secondary"],["single-asset","continuation-vehicle"],["take-private","take-private"],["NAV discount","secondary-pricing"]].forEach(([s,id])=>{if(byId[id])pairs.push([s,id,false])});
  pairs.sort((a,b)=>b[0].length-a[0].length);
  TERM_RX=pairs.map(([s,id,acr])=>[new RegExp("(^|[^A-Za-z])"+s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+(acr?"s?":"(s|es)?")+"(?=$|[^A-Za-z])",acr?"":"i"),id]);
}
function termsIn(text){const found=[];let t=" "+text+" ";for(const [rx,id] of TERM_RX){if(found.includes(id))continue;if(rx.test(t)){found.push(id);t=t.replace(rx,"$1 ");if(found.length>=3)break}}return found}
const termChips=text=>{const ids=termsIn(text);return ids.length?`<div class="tchips">${ids.map(id=>`<button class="tchip" data-term="${id}">${dot(byId[id].cat)}${esc(byId[id].label)}</button>`).join("")}</div>`:""};

/* ---------- Progress sync across devices ---------- */
const sync={ref:null,ok:false,timer:null,busy:false,again:false};
const markUpdated=()=>{store.set("updated",Date.now());queueSync()};
function queueSync(){if(!sync.ref)return;clearTimeout(sync.timer);sync.timer=setTimeout(writeSync,1500)}
async function writeSync(){if(sync.busy){sync.again=true;return}sync.busy=true;
  try{await sync.ref.set({status,checks,updated:store.get("updated",Date.now())})}catch(e){console.warn("sync write",e)}
  sync.busy=false;if(sync.again){sync.again=false;writeSync()}}
const readSnap=s=>{if(!s)return null;if(typeof s.data==="function")return s.data();if(s.exists===false)return null;if(s.data&&typeof s.data==="object")return s.data;return s};
async function initSync(){
  try{
    if(!window.claude||typeof claude.use!=="function")return;
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    sync.ref=db.collection("data/users/"+id).doc("progress");
    const snap=await Promise.race([sync.ref.get(),new Promise((_,r)=>setTimeout(()=>r(new Error("timeout")),10000))]);
    const data=readSnap(snap);
    if(data&&data.updated&&data.updated>store.get("updated",0)){
      status=data.status||{};checks=data.checks||{};store.set("status",status);store.set("checks",checks);store.set("updated",data.updated);
      if(ready){if(state.view==="learn")renderLearn();if(state.view==="lifecycle")renderLife();if(state.view==="legal")renderLegal();redraw()}
    }else if(Object.keys(status).length||Object.keys(checks).length)queueSync();
    sync.ok=true;
    if(ready&&state.view==="learn"&&!state.selected&&!state.chain)renderLearnHelp();
  }catch(e){console.warn("sync",e)}
}

matchMedia("(prefers-color-scheme: dark)").addEventListener("change",redraw);
new MutationObserver(redraw).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});

function fromHash(){
  const h=decodeURIComponent(location.hash.slice(1));
  if(VIEWS.includes(h)){renderIntro();setView(h);return}
  if(h.startsWith("chain-")&&CHAINS.some(c=>"chain-"+c.id===h)){selectChain(h.slice(6),true);return}
  if(byId[h]){setView("graph");selectTerm(h);return}
  renderIntro();setView(HOME);
}
window.addEventListener("hashchange",()=>{if(ready)fromHash()});
renderIntro();
load();
